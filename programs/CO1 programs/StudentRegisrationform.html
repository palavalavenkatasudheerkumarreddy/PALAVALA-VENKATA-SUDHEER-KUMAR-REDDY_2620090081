<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration Form</title>
</head>
<body>
    <h1>Student Registration Form</h1>

    <form action="#" method="post">
        <p>
            <label for="studentName">Student Name:</label><br>
            <input type="text" id="studentName" name="studentName" placeholder="Enter your name" required>
        </p>

        <p>
            <label for="studentEmail">Email:</label><br>
            <input type="email" id="studentEmail" name="studentEmail" placeholder="Enter your email" required>
        </p>

        <p>
            <label for="studentPassword">Password:</label><br>
            <input type="password" id="studentPassword" name="studentPassword" required>
        </p>

        <p>
            <span>Gender:</span><br>
            <input type="radio" id="genderMale" name="gender" value="Male">
            <label for="genderMale">Male</label>

            <input type="radio" id="genderFemale" name="gender" value="Female">
            <label for="genderFemale">Female</label>
        </p>

        <p>
            <span>Subjects:</span><br>
            <input type="checkbox" id="subHtml" name="subjects" value="HTML">
            <label for="subHtml">HTML</label>

            <input type="checkbox" id="subCss" name="subjects" value="CSS">
            <label for="subCss">CSS</label>

            <input type="checkbox" id="subJs" name="subjects" value="JS">
            <label for="subJs">JS</label>
        </p>

        <p>
            <label for="branchSelect">Branch:</label><br>
            <select id="branchSelect" name="branch">
                <option value="CSE">CSE</option>
                <option value="ECE">ECE</option>
                <option value="EEE">EEE</option>
            </select>
        </p>

        <p>
            <label for="addressBox">Address:</label><br>
            <textarea id="addressBox" name="address" rows="4" cols="35" placeholder="Enter your address"></textarea>
        </p>

        <p>
            <input type="submit" value="Register">
            <input type="reset" value="Reset">
        </p>
    </form>
</body>
</html>
