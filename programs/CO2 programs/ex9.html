<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 9 - Motion</title>
    <style>
        * { box-sizing: border-box; }
        .btn {
            padding: 0.75rem 1.25rem;
            background: royalblue;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.3s ease;
        }
        .btn:hover {
            background: indigo;
            transform: scale(1.05);
        }
        @keyframes slide {
            from { transform: translateX(0); }
            to { transform: translateX(200px); }
        }
        .box {
            margin-top: 1.5rem;
            width: 120px;
            padding: 1rem;
            background: teal;
            color: white;
            text-align: center;
            animation: slide 2s infinite alternate;
        }
        @media (prefers-reduced-motion: reduce) {
            .box, .btn {
                animation: none;
                transition: none;
            }
        }
    </style>
</head>
<body>
    <button type="button" class="btn">Hover Me</button>
    <div class="box">Sliding Box</div>
</body>
</html>
