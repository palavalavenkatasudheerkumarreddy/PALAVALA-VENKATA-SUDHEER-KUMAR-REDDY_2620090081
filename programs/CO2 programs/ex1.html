<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 1 - Specificity</title>
    <style>
        /* Specificity order: ID (#main) > Class (.box) > Element/Tag (p) */
        p { color: green; }
        .box { color: red; }
        #main { color: blue; }
        /* p { color: orange !important; } */
    </style>
</head>
<body>
    <p class="box" id="main">Hello CSS</p>
</body>
</html>
