<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 6 - Design Tokens</title>
    <style>
        :root {
            --brand: rebeccapurple;
            --surface: white;
            --text: #111;
            --spacing: 1rem;
            --radius: 10px;
        }
        .dark {
            --surface: #222;
            --brand: gold;
            --text: #f5f5f5;
        }
        * { box-sizing: border-box; }
        body {
            background: var(--surface);
            color: var(--text);
            padding: var(--spacing);
            font-family: sans-serif;
        }
        .card {
            background: var(--surface);
            color: var(--brand);
            padding: var(--spacing);
            border-radius: var(--radius);
            border: 2px solid var(--brand);
            margin-top: var(--spacing);
        }
    </style>
</head>
<body>
    <button type="button" onclick="document.body.classList.toggle('dark')">Toggle Dark Theme</button>
    <div class="card">
        <h2>Design Token Card</h2>
        <p>Theme updates via CSS variables.</p>
    </div>
</body>
</html>
