<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 7 - BEM Product Card</title>
    <style>
        * { box-sizing: border-box; }
        .product-card {
            padding: 1rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 1rem;
            max-width: 280px;

            &:hover {
                box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
            }
            .product-card__image {
                display: block;
                max-width: 100%;
                height: auto;
            }
            .product-card__title {
                font-size: 1.2rem;
                margin: 0.75rem 0 0.25rem;
            }
            .product-card__price {
                font-weight: bold;
                margin: 0;
            }
            &.product-card--featured {
                border: 2px solid rebeccapurple;
            }
        }
    </style>
</head>
<body>
    <article class="product-card">
        <img class="product-card__image" src="https://via.placeholder.com/240x140" alt="Standard Headphones">
        <h2 class="product-card__title">Wireless Headphones</h2>
        <p class="product-card__price">₹2,499</p>
    </article>

    <article class="product-card product-card--featured">
        <img class="product-card__image" src="https://via.placeholder.com/240x140" alt="Featured Keyboard">
        <h2 class="product-card__title">Mechanical Keyboard</h2>
        <p class="product-card__price">₹4,999</p>
    </article>
</body>
</html>
