<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 4 - CSS Grid Gallery</title>
    <style>
        * { box-sizing: border-box; }
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            /* Try: repeat(2, 1fr); or 1fr 2fr 1fr; */
            /* Responsive auto-fit: grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); */
            gap: 1rem;
        }
        .tile {
            background: #e3e8f2;
            padding: 2rem;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="gallery">
        <div class="tile">1</div>
        <div class="tile">2</div>
        <div class="tile">3</div>
        <div class="tile">4</div>
        <div class="tile">5</div>
        <div class="tile">6</div>
    </div>
</body>
</html>
