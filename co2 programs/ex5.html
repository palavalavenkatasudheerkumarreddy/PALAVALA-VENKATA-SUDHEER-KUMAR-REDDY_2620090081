<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 5 - Mobile-First Layout</title>
    <style>
        * { box-sizing: border-box; }
        .layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }
        .main-col, .side-col {
            padding: 1.5rem;
            background: #eef2f7;
        }
        @media (min-width: 48rem) {
            .layout { grid-template-columns: 2fr 1fr; }
        }
    </style>
</head>
<body>
    <div class="layout">
        <main class="main-col">Main Content</main>
        <aside class="side-col">Sidebar</aside>
    </div>
</body>
</html>
